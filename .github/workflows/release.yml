name: release

# Builds the slice binary for every target in packages/platforms.json from the
# runtime repository's release tag v<version>, stages it into the platform packages
# and publishes all npm packages in lockstep with provenance.
#
# The version is the one committed on main (packages/cli/package.json, kept in lockstep
# by `npm run npm:version`), not a typed input: merge the version bump first, then run
# this workflow from main. The runtime tag is derived from it, so a release only ever
# builds a released runtime that matches the reviewed package versions.
#
# Authentication: npm trusted publishing (OIDC). Each package trusts this workflow
# file and the `npm` environment; no npm token is stored anywhere.
# With `stage`, packages go to npm's Staged Packages and are published only after a
# maintainer approves them on npmjs.com (or `npm stage approve <id>`) with 2FA.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack only, do not publish (for testing workflow changes; a normal release does not need it)"
        type: boolean
        default: false
      stage:
        description: "Stage instead of publish; a maintainer approves each package on npmjs.com with 2FA"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    # The committed version decides what is built and published. Runs from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: read
        name: Read and check the committed version
        shell: bash
        run: |
          node scripts/npm/sync-versions.mjs --check
          version="$(node -p 'require("./packages/cli/package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version $version"; exit 1; }
          git ls-remote --exit-code --tags https://github.com/slicevm/slice "refs/tags/v$version" > /dev/null || { echo "slicevm/slice has no release tag v$version; release the runtime first"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from runtime v$version"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # oldest supported glibc runner, maximizes compatibility
            exe: slice
          - triple: aarch64-apple-darwin
            os: macos-15
            exe: slice
          - triple: x86_64-apple-darwin
            os: macos-15-intel # native Intel runner, so the version check runs the binary as built
            exe: slice
          - triple: x86_64-pc-windows-msvc
            os: windows-2022
            exe: slice.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out runtime
        uses: actions/checkout@v7
        with:
          repository: slicevm/slice
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.triple }}
      # No build cache: release builds start clean, so nothing a build writes can feed a
      # later release.
      - name: Build
        run: cargo build --release --locked -p slice-cli --target ${{ matrix.triple }}
      - name: Check version
        shell: bash
        run: |
          out="$(./target/${{ matrix.triple }}/release/${{ matrix.exe }} --version)"
          echo "$out"
          echo "$out" | grep -q "v${{ needs.version.outputs.version }}" || { echo "binary version does not match ${{ needs.version.outputs.version }}"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.triple }}
          path: target/${{ matrix.triple }}/release/${{ matrix.exe }}
          if-no-files-found: error

  verify:
    # Stages, tests and packs everything. Dry runs end here, so they need no approval.
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same as ci.yml; only publish needs npm 11
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          path: dist-bin
          pattern: slice-*
      - name: Arrange artifacts as dist-bin/<triple>/slice[.exe]
        run: |
          for d in dist-bin/slice-*; do mv "$d" "dist-bin/${d#dist-bin/slice-}"; done
          find dist-bin -type f
      - run: npm ci
      - run: node scripts/npm/sync-versions.mjs --check
      - name: Platform packages match the committed ones
        run: |
          node scripts/npm/generate-platform-packages.mjs
          # Content only: npm ci marks the bin launchers executable, which is not a change.
          git -c core.fileMode=false diff --exit-code -- packages
      - run: node scripts/npm/stage-binaries.mjs --from=dist-bin --strict
      - run: npm run build
      - name: Test packages against the staged linux binary
        run: |
          export SLICE_TEST_BINARY="$PWD/packages/cli-linux-x64-gnu/bin/slice"
          SLICE_BINARY_PATH="$SLICE_TEST_BINARY" npm test
      - name: Pack
        run: |
          mkdir -p npm-dist
          # Publish order: platform packages first so the wrapper's optionalDependencies resolve.
          for p in packages/cli-* packages/cli packages/mcp packages/sdk; do
            npm pack "./$p" --pack-destination npm-dist --json | node -e 'for (const x of JSON.parse(require("fs").readFileSync(0))) console.log(x.filename)' >> npm-dist/order.txt
          done
          cat npm-dist/order.txt
          ls -l npm-dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: npm-dist/
          if-no-files-found: error

  publish:
    # Publishes exactly the tarballs that verify tested. Gated by the npm environment.
    if: ${{ !inputs.dry_run }}
    needs: [version, verify]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11, needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: npm-dist
      - run: npm --version
      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
          STAGE: ${{ inputs.stage }}
        run: |
          cd npm-dist
          while read -r tgz; do
            name="$(tar -xOzf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published, skipping"
            elif [ "$STAGE" = "true" ]; then
              npm stage publish "./$tgz" --provenance --access public
            else
              npm publish "./$tgz" --provenance --access public
            fi
          done < order.txt
