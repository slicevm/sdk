name: release

# Builds the slice binary for every target in packages/platforms.json from the
# runtime repository at the given ref, stages it into the platform packages and
# publishes all npm packages in lockstep with provenance.
#
# Authentication: npm trusted publishing (OIDC). Each package trusts this workflow
# file and the `npm` environment; no npm token is stored anywhere.
# With `stage`, packages go to npm's Staged Packages and are published only after a
# maintainer approves them on npmjs.com (or `npm stage approve <id>`) with 2FA.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.13.5); must match the runtime release"
        required: true
      runtime_ref:
        description: "Git ref of the runtime repository to build (e.g. v0.13.5)"
        required: true
      dry_run:
        description: "Build and pack only, do not publish"
        type: boolean
        default: true
      stage:
        description: "Stage instead of publish; a maintainer approves each package on npmjs.com with 2FA"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-inputs:
    # Builds only the runtime's own release tag for this version (v<version>), never an
    # arbitrary branch or commit, so the build job runs only released runtime code.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check version and runtime_ref
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME_REF: ${{ inputs.runtime_ref }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 0.14.6"; exit 1; }
          [ "$RUNTIME_REF" = "v$VERSION" ] || { echo "runtime_ref must be the release tag v$VERSION"; exit 1; }
          git ls-remote --exit-code --tags https://github.com/slicevm/slice "refs/tags/$RUNTIME_REF" > /dev/null || { echo "slicevm/slice has no tag $RUNTIME_REF"; exit 1; }

  build:
    needs: check-inputs
    strategy:
      fail-fast: true
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # oldest supported glibc runner, maximizes compatibility
            exe: slice
          - triple: aarch64-apple-darwin
            os: macos-15
            exe: slice
          - triple: x86_64-pc-windows-msvc
            os: windows-2022
            exe: slice.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out runtime
        uses: actions/checkout@v7
        with:
          repository: slicevm/slice
          ref: ${{ inputs.runtime_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.triple }}
      # No build cache: release builds start clean, so a cache written by a build of
      # inputs.runtime_ref can never feed a later release (cache poisoning).
      - name: Build
        run: cargo build --release --locked -p slice-cli --target ${{ matrix.triple }}
      - name: Check version
        shell: bash
        run: |
          out="$(./target/${{ matrix.triple }}/release/${{ matrix.exe }} --version)"
          echo "$out"
          echo "$out" | grep -q "v${{ inputs.version }}" || { echo "binary version does not match ${{ inputs.version }}"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.triple }}
          path: target/${{ matrix.triple }}/release/${{ matrix.exe }}
          if-no-files-found: error

  verify:
    # Stages, tests and packs everything. Dry runs end here, so they need no approval.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same as ci.yml; only publish needs npm 11
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          path: dist-bin
          pattern: slice-*
      - name: Arrange artifacts as dist-bin/<triple>/slice[.exe]
        run: |
          for d in dist-bin/slice-*; do mv "$d" "dist-bin/${d#dist-bin/slice-}"; done
          find dist-bin -type f
      - run: npm ci
      - run: node scripts/npm/sync-versions.mjs ${{ inputs.version }}
      - run: node scripts/npm/generate-platform-packages.mjs
      - run: node scripts/npm/stage-binaries.mjs --from=dist-bin --strict
      - run: npm run build
      - name: Test packages against the staged linux binary
        run: |
          export SLICE_TEST_BINARY="$PWD/packages/cli-linux-x64-gnu/bin/slice"
          SLICE_BINARY_PATH="$SLICE_TEST_BINARY" npm test
      - name: Pack
        run: |
          mkdir -p npm-dist
          # Publish order: platform packages first so the wrapper's optionalDependencies resolve.
          for p in packages/cli-* packages/cli packages/mcp packages/sdk; do
            npm pack "./$p" --pack-destination npm-dist --json | node -e 'for (const x of JSON.parse(require("fs").readFileSync(0))) console.log(x.filename)' >> npm-dist/order.txt
          done
          cat npm-dist/order.txt
          ls -l npm-dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: npm-dist/
          if-no-files-found: error

  publish:
    # Publishes exactly the tarballs that verify tested. Gated by the npm environment.
    if: ${{ !inputs.dry_run }}
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11, needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: npm-dist
      - run: npm --version
      - name: Publish
        run: |
          cd npm-dist
          while read -r tgz; do
            name="$(tar -xOzf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            if npm view "$name@${{ inputs.version }}" version >/dev/null 2>&1; then
              echo "$name@${{ inputs.version }} is already published, skipping"
            elif [ "${{ inputs.stage }}" = "true" ]; then
              npm stage publish "./$tgz" --provenance --access public
            else
              npm publish "./$tgz" --provenance --access public
            fi
          done < order.txt
