name: Feature request
description: Suggest an improvement to the SDK, the MCP server or the CLI package
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@slicevm/sdk"
        - "@slicevm/mcp"
        - "@slicevm/cli"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      render: typescript
    validations:
      required: false
